syntax = "proto3";

package volue.mesh.grpc.calc.v2alpha;

import "google/protobuf/timestamp.proto";

import "type/resources.proto";


// Mesh calculation service
// -------------------------------
// The Mesh calculation service is an API for running Mesh calculations.
//
service CalculationService {

  // Run ad-hoc calculation.
  //
  // The default max client inbound message size is 4 megabytes. If the
  // response size is greater than this limit, a `RESOURCE_EXHAUSTED` status is
  // returned.
  //
  // Each time series point occupies 20 bytes. In case of larger data volumes
  // please send request data in chunks or increase the maximum gRPC inbound
  // message size from the client side. The limit can be configured when
  // creating the connection to the Mesh server.
  //
  // Note: the logs returned in the response are unstable. The caller must not
  // depend on the logs' content.
  rpc RunCalculation(CalculationRequest) returns (CalculationResponse) {}
}

message CalculationRequest {
  volue.mesh.grpc.type.Guid session_id = 1;
  string expression = 2;
  volue.mesh.grpc.type.UtcInterval interval = 3;
  volue.mesh.grpc.type.MeshId relative_to = 4;
  bool enable_logs = 5;
}

message Log {
  google.protobuf.Timestamp timestamp = 1;
  volue.mesh.grpc.type.LogLevel level = 2;
  string message = 3;
}

message CalculationResponse {
  oneof calculation_result_oneof {
    // Not all fields in Timeseries result will be set (e.g. `path`,
    // or `timeseries_key` in the `id` field)
    TimeseriesResults timeseries_results = 1;
    NumericResults numeric_results = 2;
    StringResults string_results = 3;
  }

  // Set the 'enable_logs' flag in the request to get the logs.
  //
  // Note: the logs returned in the response are unstable. The caller must not
  // depend on the logs' content.
  repeated Log logs = 4;
}

message Timeseries {
  volue.mesh.grpc.type.MeshId id = 1;

  // Resolution/spacing for this timeseries.
  volue.mesh.grpc.type.Resolution resolution = 2;

  // Time interval for this timeseries.
  volue.mesh.grpc.type.UtcInterval interval = 3;

  // Data contains an Apache Arrow byte representation of the time series
  // points. If no points exist empty table will be returned.
  // Stored in the following columns:
  // 0: (timestamp('ms')) utc_time - UTC Unix timestamp expressed in
  //    milliseconds (internally it is stored as a 64-bit integer)
  // 1: (uint32) flags
  // 2: (double) value
  bytes data = 4;
}

message TimeseriesResults {
  repeated Timeseries timeseries = 1;
}

message NumericResults {
  repeated double values = 1;
}

message StringResults {
  repeated string values = 1;
}
